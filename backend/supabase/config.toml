# Supabase CLI configuration (https://supabase.com/docs/guides/local-development/cli/config)
# Used by `supabase start` (local) and `supabase config push` (hosted project).
# Run CLI commands from the backend/ directory.

project_id = "staff-performance-dashboard"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
# Must match NEXT_PUBLIC_SITE_URL. Change both for production.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://*.vercel.app/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public registration: accounts are created by administrators only.
enable_signup = false
enable_anonymous_sign_ins = false           
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 2  
# Per IP per 5 min. Sign-in runs server-side, so all staff share the server's IP:
# keep this comfortably above "whole team signs in at shift start".
sign_in_sign_ups = 150
token_verifications = 30

[auth.email]
# Email + password sign-in stays enabled; registration is blocked by [auth] enable_signup = false.
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"

[auth.email.template.invite]
subject = "You're invited to Staff Performance"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Staff Performance password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enabled = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false
